<script>

:root[data-skin="n16"]{--hacc:#F0932B;}
:root[data-skin="g16"]{--hacc:#F8B47A;}
:root[data-skin="n16"] .tab-btn.active{background:#F0932B;color:#1F1300;border-color:#F0932B;}
:root[data-skin="g16"]{ color-scheme:light; --bg:#4B5058; --bg2:#41464E; --panel:#C9CFDA; --panel2:#E6EAF1; --grid:rgba(255,255,255,0.06); --gridStrong:#9AAEC6; --line:#1B2A41; --accent:#F8B47A; --accent2:#F8B47A; --accent3:#15803D; --text:#0F172A; --textDim:#4A5870; --border:#A9B3C4; --track:#FFFFFF; --shadowCol:rgba(0,0,0,0.14); --danger:#D64545; --onAccent:#1F1300; --radius:8px; --atext:#8A4F00; --e1:#C27A0E; --e2:#D6336C; --et:#15803D; --blue:#2563EB; --c-ae:#D9600F; --c-th:#6A3DD0; --c-s:#0E8FA0; --c-ag:#4D7C0F; --car:#F0932B; --htext:#F1F5F9; --hdim:#CBD5E1; --st-track:#D3D7DE; --st-text:#1B2A41; --st-dim:#5A6A82; --st-grid:rgba(31,45,61,0.08); --st-gridS:#9AAEC6; }
:root[data-skin="n13"] .tile,:root[data-skin="n13"] .sim-btn,:root[data-skin="n13"] .cat-heading,:root[data-skin="g16"] .tile,:root[data-skin="g16"] .sim-btn,:root[data-skin="g16"] .cat-heading{--text:#E2E8F0;--textDim:#94A3B8;--panel:#1E293B;--panel2:#162033;--border:#334155;--atext:#F8B47A;}
:root{
  --accent-dim: color-mix(in srgb, var(--accent) 35%, transparent);
  --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  background-image:
    repeating-linear-gradient(var(--grid) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 32px);
  color: var(--htext);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

.wrap{max-width: 1180px; margin:0 auto; padding: 22px 18px 60px;}

header{
  border-bottom: 1px solid var(--grid);
  padding-bottom: 18px;
  margin-bottom: 20px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
h1{
  font-family:'Oswald', sans-serif;
  font-weight:600;
  letter-spacing: 0.02em;
  font-size: clamp(26px, 4.6vw, 38px);
  margin: 0 0 4px 0;
}
h1 span{color: var(--hacc, var(--atext));}
.byline{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.04em;
  color: var(--hdim);
  margin-top:4px;
}
.subtitle{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color: var(--hdim);
}
.skin-wrap{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;}
.skin-select{
  text-align:center;text-align-last:center;
  background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 12px;font-family:'Inter',sans-serif;font-size:.85rem;
  min-width:200px;max-width:100%;cursor:pointer;
}
.skin-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* search */
.search-row{ margin: 20px 0 18px; }
.search-box{ position:relative; max-width: 520px; }
.search-box input{
  width:100%;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  font-family:'IBM Plex Mono', monospace;
  font-size:14px;
  padding: 13px 16px 13px 40px;
  border-radius: var(--radius);
  outline:none;
}
.search-box input::placeholder{color: var(--textDim);}
.search-box input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.search-box .icon{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  color: var(--textDim); font-size:15px; pointer-events:none;
}
.result-count{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; color: var(--hdim); margin-top:8px; letter-spacing:0.04em;
}

/* tabs */
.tab-row{
  display:flex; gap:16px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.tab-row::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1 1 0; min-width:max-content; text-align:center;
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.04em; text-transform:uppercase;
  padding:10px 16px; border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel); color: var(--textDim);
  cursor:pointer; white-space:nowrap;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.tab-btn:hover{border-color: var(--accent-dim); color: var(--text);}
.tab-btn.active{background: var(--accent); color: var(--onAccent); border-color: var(--accent);}
.tab-btn:focus-visible{outline: 2px solid var(--accent); outline-offset:2px;}

.sub-tab-row{
  display:none; gap:6px; margin: 4px 0 20px; padding: 12px;
  background: var(--accent-soft);
  border: 1px dashed var(--accent-dim);
  border-radius: var(--radius);
  flex-wrap:wrap; align-items:center;
}
.sub-tab-row.show{display:flex;}
.sub-tab-row .lbl{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--hdim);
  letter-spacing:0.06em; text-transform:uppercase; margin-right:4px;
}
.sub-btn{
  font-family:'Oswald', sans-serif; font-weight:500; font-size:11.5px;
  letter-spacing:0.03em; text-transform:uppercase;
  padding:7px 13px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--panel); color: var(--textDim);
  cursor:pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.sub-btn:hover{border-color: var(--accent-dim); color: var(--text);}
.sub-btn.active{background: var(--accent-dim); color: var(--text); border-color: var(--accent);}

/* section heading */
.section-title{
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.1em;
  text-transform:uppercase; color: var(--hdim); margin: 26px 0 12px;
  display:flex; align-items:center; gap:10px;
}
.section-title::after{content:''; flex:1; height:1px; background: var(--grid);}

/* category tiles */
.tiles{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width:760px){ .tiles{grid-template-columns: repeat(2, 1fr);} }
@media (max-width:480px){ .tiles{grid-template-columns: 1fr;} }
.tile{
  position:relative; text-align:left; cursor:pointer;
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 20px 18px;
  min-height: 160px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;
  transition: border-color 0.15s, transform 0.15s;
  font: inherit;
}
.tile:hover{border-color: var(--accent); transform: translateY(-3px);}
.tile:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.tile-icon{display:block; width:44px; height:44px; color:var(--atext);}
.tile-icon svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;}
.tile-text{display:flex; flex-direction:column; align-items:center; gap:4px;}
.tile-name{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:20px;
  letter-spacing:0.02em; line-height:1.2;
}
.tile-count{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.04em;
  color: var(--textDim);
}
.tile.empty-cat .tile-count{opacity:.7;}

/* back bar */
.back-bar{display:none; align-items:center; gap:14px; margin: 6px 0 16px; flex-wrap:wrap;}
.back-bar.show{display:flex;}
.back-btn{
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.05em; text-transform:uppercase;
  padding:9px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor:pointer;
}
.back-btn:hover{border-color: var(--accent);}
.back-title{font-family:'Oswald', sans-serif; font-weight:600; font-size:22px;}

/* grid */
.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.grid[hidden]{display:none;}

.card{
  background: linear-gradient(180deg, var(--panel), var(--panel2));
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display:flex; flex-direction:column; gap:10px;
  transition: border-color 0.15s, transform 0.15s;
}
.card:hover{border-color: var(--accent); transform: translateY(-2px);}
.card-title{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:16.5px;
  color: var(--text); margin:0; line-height:1.3;
}
.card-desc{ font-size:13px; line-height:1.5; color: var(--textDim); flex:1; }

.badge-row, .tag-row{ display:flex; flex-wrap:wrap; gap:5px; }
.badge{
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.03em;
  padding:3px 8px; border-radius:12px;
  background: color-mix(in srgb, var(--gridStrong) 22%, transparent);
  color: var(--text); border: 1px solid var(--border);
}
.tag{
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  padding:3px 8px; border-radius: var(--radius);
  background: transparent; color: var(--atext);
  border: 1px solid var(--accent-dim); cursor:pointer;
}
.tag:hover{background: var(--accent-soft);}

.card-open{
  margin-top:4px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-family:'Oswald', sans-serif; font-weight:500; font-size:12.5px;
  letter-spacing:0.05em; text-transform:uppercase; text-decoration:none;
  background: var(--accent); color: var(--onAccent);
  padding: 10px 14px; border-radius: var(--radius);
  transition: filter 0.15s;
}
.card-open:hover{filter:brightness(1.1);}

.empty{
  grid-column: 1 / -1; text-align:center; padding: 50px 20px;
  color: var(--textDim);
  font-family:'IBM Plex Mono', monospace; font-size:13px;
  border: 1px dashed var(--border); border-radius: var(--radius);
}

footer{
  margin-top: 40px; padding-top:16px; border-top: 1px solid var(--grid);
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--hdim);
  text-align:center; letter-spacing:0.04em;
}

/* ===== Στρογγυλεμένο UI · κουμπιά με μόνο τον τίτλο ===== */
:root{--r-pill:999px;--r-box:16px;}
.search-box input{border-radius:var(--r-pill);}
.skin-select{border-radius:var(--r-pill);}
.tab-row{flex-wrap:nowrap;gap:6px;justify-content:flex-start;padding:2px 2px 6px;margin-bottom:12px;}
@supports (justify-content: safe center){ .tab-row{justify-content:safe center;} }
.tab-btn{flex:0 0 auto;padding:6px 13px;font-size:11.5px;border-radius:var(--r-pill);letter-spacing:.03em;}
.sub-tab-row{border-radius:var(--r-box);width:fit-content;max-width:100%;margin:4px auto 16px;justify-content:center;}
.sub-btn{border-radius:var(--r-pill);padding:5px 12px;font-size:11px;}
.tile{border-radius:var(--r-box);}
.cat-heading{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;max-width:100%;margin:8px auto 18px;padding:9px 24px;font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;letter-spacing:.02em;color:var(--text);background:var(--panel);border:1px solid var(--accent);border-radius:var(--r-box);}
.cat-heading[hidden]{display:none;}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.ico{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--atext);}
.ico-sm{width:26px;height:26px;}
.sim-btn:hover .ico{color:var(--onAccent);}
.sim-btn{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;min-height:96px;padding:14px 18px;font-family:'Oswald',sans-serif;font-weight:500;font-size:15.5px;line-height:1.3;letter-spacing:.02em;text-decoration:none;color:var(--text);background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--accent-dim);border-radius:var(--r-box);transition:background .15s,color .15s,border-color .15s,transform .15s;}
.sim-btn:hover{background:var(--accent);color:var(--onAccent);border-color:var(--accent);transform:translateY(-2px);}
.sim-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>

<script>
/* ============================================================

   Αντέγραψε ένα block μέσα στο SIMULATIONS παρακάτω και άλλαξε:
   - id            : μοναδικό αναγνωριστικό (μόνο λατινικά, χωρίς κενά)
   - title         : τίτλος όπως θα φαίνεται στην κάρτα
   - description   : σύντομη περιγραφή (1-2 προτάσεις)
   - url           : το όνομα του .html αρχείου της προσομοίωσης
                      (πρέπει να βρίσκεται στον ίδιο φάκελο με αυτό το index.html)
   - category      : η ενότητα φυσικής (το id μιας κατηγορίας του πίνακα CATEGORIES παρακάτω).
                      Νέες κατηγορίες προστίθενται από το εργαλείο διαχείρισης. Αρχικές τιμές:
                      'mechanics'        (Μηχανική)
                      'electricity'      (Ηλεκτρισμός)
                      'thermodynamics'    (Θερμοδυναμική)
                      'nuclear'          (Πυρηνική Φυσική)
                      'optics'           (Οπτική)
                      'oscillations'     (Ταλαντώσεις)
   - grades        : σε ποιες τάξεις/ενότητες θα εμφανίζεται. Επίτρεπτες τιμές:
                      'a-gym', 'b-gym', 'g-gym',
                      'a-lyk', 'g-lyk',
                      'b-lyk-kat'  (Β Λυκείου - Φυσική Κατεύθυνσης)
                      'b-lyk-gen'  (Β Λυκείου - Φυσική Γενικής Παιδείας)
   - tags          : ελεύθερες λέξεις-κλειδιά για την αναζήτηση, όσες θέλεις

   SKINS: ο επιλογέας πάνω δεξιά αποθηκεύει το skin στο localStorage
   με κλειδί 'sim-skin' — το ίδιο που διαβάζουν οι προσομοιώσεις, άρα
   η επιλογή εφαρμόζεται και σε αυτές (αρκεί να είναι στο ίδιο domain).
   ============================================================ */

  const SIMULATIONS = [
    {
      id: 'autokinito-se-strofi',
      title: 'Κίνηση αυτοκινήτου σε στροφή',
      description: 'Περιγραφή των δυνάμεων που επιτρέπουν την κίνηση ενός αυτοκινήτου σε μία στροφή',
      url: 'autokinito-se-strofi.html',
      category: 'mechanics',
      grades: ['b-lyk-kat'],
      tags: ['κινηματική', 'κυκλική', 'στροφή', 'κεντρομόλος', 'δυνάμεις', 'αυτοκίνητο', 'ολίσθηση', 'τριβή']
    },

    {
      id: 'moto-strofi',
      title: 'Στροφή μοτοσυκλέτας',

      tags: ['κινηματική', 'κυκλική', 'στροφή', 'κεντρομόλος', 'δυνάμεις', 'μοτοσυκλέτα', 'μηχανή', 'ολίσθηση', 'τριβή']
    },

    {
      id: 'airplane-strofi',
      title: 'Στροφή αεροπλάνου',

      url: 'plane.html',
      category: 'mechanics',
      grades: ['b-lyk-kat'],
      tags: ['κινηματική', 'κυκλική', 'στροφή', 'κεντρομόλος', 'δυνάμεις', 'αεροπλάνο', 'μηχανή', 'ολίσθηση', 'άνωση', 'πτήση', 'απώλεια στήριξης']
    },

    {

    },

      url: 'kylisi.html',
      category: 'mechanics',
      grades: ['b-lyk-kat'],
      tags: ['κινηματική', 'κυκλική', 'στροφή', 'τροχός', 'περιστροφή', 'σύνθετη', 'μεταφορική']

    {

      title: 'Βρασμός και εξάτμιση',
      description: 'Περιγραφή του βρασμού και της εξάτμισης ενός υγρού',
      url: 'vrasmos-exatmisi.html',
      category: 'thermodynamics',
      grades: ['on', 'b-gym'],
      tags: ['βρασμός', 'εξάτμιση', 'υγρό', 'θερμοκρασία', 'μόρια']
    },

    {
      id: 'metavoli-fisikon-katastaseon',
      title: 'Μεταβολές φυσικών καταστάσεων',
      description: 'Περιγραφή του τρόπου με τον οποίο μεταβάλλονται οι φυσικές καταστάσεις μιας ουσίας',
      url: 'allages-katastaseon.html',
      category: 'thermodynamics',
      grades: ['on', 'b-gym'],
      tags: ['βρασμός', 'εξάτμιση', 'υγρό', 'θερμοκρασία', 'μόρια']
    },

    {

      title: 'Δύναμη Coulomb',
      description: 'Περιγραφή της δύναμης Coulomb μεταξύ φορτισμένων σωμάτων',
      url: 'dynami-coulomb.html',
      category: 'electricity',
      grades: ['on', 'g-gym', 'b-lyk-gen'],
      tags: ['ηλεκτρισμός', 'φορτίο', 'δύναμη', 'Coulomb']
    },

    {
      id: 'peristrofi-diskou-ravdou',
      title: 'Περιστροφική κίνηση δίσκου και ράβδου',
      description: 'Περιγραφή της δ περιστροφικής κίνησης δίσκου και ράβδου',
      url: 'peristrofi-diskou-tabs.html',
      category: 'mechanics',
      grades: ['on', 'b-lyk-kat', 'g-lyk'],
      tags: ['περιστροφική', 'περιστροφή', 'δίσκος', 'ράβδος', 'γωνιακή', 'επιτρόχιος', 'γραμμική', 'κεντρομόλος']
    }

    // Πρόσθεσε εδώ επόμενες προσομοιώσεις με κόμμα (,) πριν από κάθε νέο { }
  ];

  const ICONS = {"mechanics": "<circle cx=\"12\" cy=\"12\" r=\"6.5\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M16.6 7.4l1.8-1.8M16.6 16.6l1.8 1.8M7.4 16.6l-1.8 1.8M7.4 7.4 5.6 5.6\"/>", "electricity": "<path d=\"M13 2.5 5.5 13.5H11l-1 8 8.500-11.500H13z\"/>", "electromagnetism": "<path d=\"M5 3h4v8a3 3 0 0 0 6 0V3h4v8a7 7 0 0 1-14 0z\"/><path d=\"M5 7h4M15 7h4\"/>", "nuclear": "<ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4\" transform=\"rotate(60 12 12)\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10\" ry=\"4\" transform=\"rotate(120 12 12)\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\"/>", "optics": "<path d=\"M12 3c-5.500 4-5.500 14 0 18 5.500-4 5.500-14 0-18z\"/><path d=\"M2 12h20\"/>", "thermo": "<path d=\"M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z\"/><path d=\"M12 8v7\"/>", "sound": "<path d=\"M4 9h3l5-4v14l-5-4H4z\"/><path d=\"M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11\"/>", "generic": "<path d=\"M12 3l8 4.5v9L12 21l-8-4.5v-9z\"/><path d=\"M12 12l8-4.5M12 12v9M12 12 4 7.5\"/>", "oscillations": "<path d=\"M2 12c2.200-8 4.400-8 6.700 0s4.500 8 6.700 0 4.400-8 6.600 0\"/>"};
  const CATEGORIES = [
    { id: 'mechanics', label: 'Μηχανική - Κινηματική', icon: 'mechanics' },
    { id: 'electricity', label: 'Ηλεκτρισμός', icon: 'electricity' },
    { id: 'thermodynamics', label: 'Θερμοδυναμική', icon: 'thermo' },
    { id: 'nuclear', label: 'Πυρηνική Φυσική', icon: 'nuclear' },
    { id: 'optics', label: 'Οπτική', icon: 'optics' },
    { id: 'oscillations', label: 'Ταλαντώσεις', icon: 'oscillations' }
  ];
  const CAT_LABELS = Object.fromEntries(CATEGORIES.map(c => [c.id, c.label]));

  /* ---------- Μινιμαλ εικονίδια προσομοιώσεων ----------
     Επιλέγονται αυτόματα από id / τίτλο / tags. Για να επιβάλεις συγκεκριμένο εικονίδιο
     πρόσθεσε στην εγγραφή:  icon: 'car'  (ή άλλο κλειδί του SIM_ICONS).
     Αν δεν ταιριάζει κανένα, χρησιμοποιείται το εικονίδιο της κατηγορίας. */
  const SIM_ICONS = {
    car: '<path d="M3.5 16v-3.500l1.800-4.200A1.500 1.500 0 0 1 6.700 7.300h10.600a1.500 1.500 0 0 1 1.400 1l1.800 4.200V16"/><path d="M3.500 16h17M5.500 12h13"/><circle cx="7.500" cy="16.500" r="1.800"/><circle cx="16.500" cy="16.500" r="1.800"/>',
    motorcycle: '<circle cx="5.500" cy="16" r="3"/><circle cx="18.500" cy="16" r="3"/><path d="M5.500 16l3-6h5l2.500 6"/><path d="M13.500 10l1.500-3h2.500M8.500 10h-2"/>',
    airplane: '<path d="M21 14.500 13.500 11V5.500a1.500 1.500 0 0 0-3 0V11L3 14.500v1.700l7.500-2v4l-2 1.500v1.300l3.500-1 3.500 1v-1.300l-2-1.500v-4l7.500 2z"/>',
    gears: '<circle cx="9" cy="9" r="4.500"/><circle cx="9" cy="9" r="1.300"/><path d="M9 2.500v2M9 13.500v2M2.500 9h2M13.500 9h2M4.400 4.400l1.400 1.400M12.200 12.200l1.400 1.400M13.600 4.400l-1.400 1.400M5.800 12.200l-1.400 1.400"/><circle cx="17.500" cy="17.500" r="2.800"/><path d="M17.500 13.600v1.200M17.500 20.200v1.200M13.600 17.500h1.200M20.200 17.500h1.200"/>',
    rolling: '<circle cx="12" cy="11" r="6.500"/><circle cx="12" cy="11" r="1"/><path d="M12 4.500v4M12 13.500v4M5.500 11h4M14.500 11h4"/><path d="M3 17.500h18"/>',
    projectile: '<path d="M3 19Q9 1 15 19"/><circle cx="9" cy="7.500" r="1.600"/><path d="M3 19h18"/>',
    refraction: '<path d="M3 12h18"/><path d="M12 4v16" stroke-dasharray="2 2"/><path d="M5 5l7 7 4 8"/>',
    bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.500 10.900c.6.5 1 1.200 1 2.100h5c0-.9.4-1.600 1-2.100A6 6 0 0 0 12 3z"/>',
    pendulum: '<path d="M4 3h16"/><path d="M12 3L7 16"/><circle cx="6.500" cy="17.800" r="2"/><path d="M12 3l5.500 13" stroke-dasharray="2 2"/>',
    line: '<path d="M3 12h16M15 8l4 4-4 4"/><path d="M6 9v6M10 9v6"/>',
    atom: ICONS.nuclear,
    search: '<circle cx="11" cy="11" r="6"/><path d="M16 16l4.500 4.500"/>'
  };
  const ICON_RULES = [
    ['motorcycle', /μοτοσυκλ|moto/],
    ['car',        /αυτοκιν|autokin/],
    ['airplane',   /αεροπλ|airplane|aeroplan/],
    ['gears',      /γρανα|ιμαντ|granaz|gryanaz|imant/],
    ['rolling',    /κυλιση|κυλιομ|kylisi/],
    ['projectile', /βολη|βολης|volis|volh/],
    ['pendulum',   /εκκρεμ|ekkrem/],
    ['bulb',       /κυκλωμα|kikloma|kyklom/],
    ['refraction', /διαθλ|diathl|φωτος|φως/],
    ['atom',       /ατομ|atom|σχαση|sxasi|πυρην|pyrin|pirin/],
    ['line',       /ευθυγραμμ|eythigramm/]
  ];
  function norm(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function simIconInner(sim){
    if (sim.icon && SIM_ICONS[sim.icon]) return SIM_ICONS[sim.icon];
    const hay = norm(sim.id + ' ' + sim.title + ' ' + (sim.tags || []).join(' '));
    for (const r of ICON_RULES) if (r[1].test(hay)) return SIM_ICONS[r[0]];
    const cat = CATEGORIES.find(c => c.id === sim.category);
    return ICONS[cat ? cat.icon : 'generic'] || ICONS.generic;
  }
  function svgIcon(inner, cls){
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('class', cls);
    svg.innerHTML = inner;
    return svg;
  }

  const GRADES = [
    { id: 'a-gym', label: 'Α Γυμνασίου' },
    { id: 'b-gym', label: 'Β Γυμνασίου' },
    { id: 'g-gym', label: 'Γ Γυμνασίου' },
    { id: 'a-lyk', label: 'Α Λυκείου' },
    { id: 'b-lyk', label: 'Β Λυκείου' },
    { id: 'g-lyk', label: 'Γ Λυκείου' }
  ];
  const GRADE_LABELS = Object.fromEntries(GRADES.map(g => [g.id, g.label]));
  GRADE_LABELS['b-lyk-kat'] = 'Β Λυκείου · Κατεύθυνσης';
  GRADE_LABELS['b-lyk-gen'] = 'Β Λυκείου · Γενικής Παιδείας';

  const B_LYK_SUB = [
    { id: 'b-lyk-all', label: 'Όλα Β Λυκείου' },
    { id: 'b-lyk-kat', label: 'Φυσική Κατεύθυνσης' },
    { id: 'b-lyk-gen', label: 'Φυσική Γενικής Παιδείας' }
  ];

  let activeGrade = 'all';
  let activeSub = 'b-lyk-all';
  let activeCategory = null;
  let searchQuery = '';

  const $ = id => document.getElementById(id);
  const tabRow = $('tabRow'), subTabRow = $('subTabRow'), grid = $('grid');
  const searchInput = $('searchInput');
  const tilesSection = $('tilesSection'), tilesEl = $('tiles');
  const catHeading = $('catHeading');

  function renderTabs(){
    tabRow.innerHTML = '';
    const showingList = searchQuery.trim() !== '' || activeCategory !== null;
    const allBtn = document.createElement('button');
    allBtn.type = 'button';
    allBtn.className = 'tab-btn all-btn' + (!showingList ? ' active' : '');
    allBtn.textContent = 'Όλες οι ενότητες';
    allBtn.addEventListener('click', () => {
      activeCategory = null; searchQuery = ''; searchInput.value = '';
      render();
    });
    tabRow.appendChild(allBtn);
    GRADES.forEach(g => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab-btn' + (activeGrade === g.id ? ' active' : '');
      btn.textContent = g.label;
      btn.addEventListener('click', () => {
        activeGrade = (activeGrade === g.id) ? 'all' : g.id;   /* δεύτερο κλικ = όλες οι τάξεις */
        renderTabs(); renderSubTabs(); render();
      });
      tabRow.appendChild(btn);
    });
  }

  function renderSubTabs(){
    subTabRow.innerHTML = '';
    if (activeGrade !== 'b-lyk'){ subTabRow.classList.remove('show'); return; }
    subTabRow.classList.add('show');
    const lbl = document.createElement('span');
    lbl.className = 'lbl'; lbl.textContent = 'Ενότητα:';
    subTabRow.appendChild(lbl);
    B_LYK_SUB.forEach(s => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sub-btn' + (activeSub === s.id ? ' active' : '');
      btn.textContent = s.label;
      btn.addEventListener('click', () => { activeSub = s.id; renderSubTabs(); render(); });
      subTabRow.appendChild(btn);
    });
  }

  /* φίλτρο τάξης (χωρίς κατηγορία/αναζήτηση) */
  function byGrade(){
    let list = SIMULATIONS.slice();
    if (activeGrade === 'all') return list;
    if (activeGrade === 'b-lyk'){
      if (activeSub === 'b-lyk-all')
        return list.filter(s => s.grades.includes('b-lyk-kat') || s.grades.includes('b-lyk-gen'));
      return list.filter(s => s.grades.includes(activeSub));
    }
    return list.filter(s => s.grades.includes(activeGrade));
  }

  function getFiltered(){
    let list = byGrade();
    if (activeCategory) list = list.filter(s => s.category === activeCategory);
    const q = searchQuery.trim().toLowerCase();
    if (q){
      list = list.filter(s =>
        s.title.toLowerCase().includes(q) ||
        s.description.toLowerCase().includes(q) ||
        (CAT_LABELS[s.category] || '').toLowerCase().includes(q) ||
        s.tags.some(t => t.toLowerCase().includes(q))
      );
    }
    list.sort((a,b) => a.title.localeCompare(b.title, 'el'));
    return list;
  }

  function setTagSearch(tag){
    searchInput.value = tag; searchQuery = tag;
    render(); searchInput.focus();
  }

  function renderTiles(){
    const pool = byGrade();
    tilesEl.innerHTML = '';
    CATEGORIES.forEach(c => {
      const n = pool.filter(s => s.category === c.id).length;
      const t = document.createElement('button');
      t.type = 'button';
      t.className = 'tile' + (n === 0 ? ' empty-cat' : '');
      t.innerHTML = '<span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true"></svg></span><span class="tile-text"><span class="tile-name"></span><span class="tile-count"></span></span>';
      t.querySelector('svg').innerHTML = ICONS[c.icon] || ICONS.generic;
      t.querySelector('.tile-name').textContent = c.label;
      t.querySelector('.tile-count').textContent =
        n === 0 ? 'Σύντομα' : n + (n === 1 ? ' προσομοίωση' : ' προσομοιώσεις');
      t.addEventListener('click', () => { activeCategory = c.id; render(); window.scrollTo({top:0, behavior:'smooth'}); });
      tilesEl.appendChild(t);
    });
  }

  function renderGrid(list){
    grid.innerHTML = '';
    if (list.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Δεν βρέθηκαν προσομοιώσεις για αυτή την επιλογή. Δοκίμασε άλλη λέξη-κλειδί, τάξη ή ενότητα.';
      grid.appendChild(empty);
      return;
    }
    list.forEach(s => {
      const a = document.createElement('a');
      a.className = 'sim-btn';
      a.href = s.url;
      a.appendChild(svgIcon(simIconInner(s), 'ico'));
      const lbl = document.createElement('span');
      lbl.textContent = s.title;
      a.appendChild(lbl);
      if (s.description) a.title = s.description;   /* η περιγραφή φαίνεται ως υπόδειξη */
      grid.appendChild(a);
    });
  }

  function render(){
    const searching = searchQuery.trim() !== '';
    const showList = searching || activeCategory !== null;

    tilesSection.hidden = showList;
    grid.hidden = !showList;
    const ab = tabRow.querySelector('.all-btn');
    if (ab) ab.classList.toggle('active', !showList);
    catHeading.hidden = !showList;
    catHeading.textContent = '';
    if (showList){
      const cat = CATEGORIES.find(c => c.id === activeCategory);
      catHeading.appendChild(svgIcon(cat ? (ICONS[cat.icon] || ICONS.generic) : SIM_ICONS.search, 'ico ico-sm'));
      const t = document.createElement('span');
      t.textContent = activeCategory ? CAT_LABELS[activeCategory] : 'Αποτελέσματα αναζήτησης';
      catHeading.appendChild(t);
    }

    if (showList){
      const list = getFiltered();
      renderGrid(list);
    } else {
      renderTiles();
    }
  }

  searchInput.addEventListener('input', () => { searchQuery = searchInput.value; render(); });

  /* ---------- SKINS (ίδια με το πρότυπο των προσομοιώσεων) ---------- */
  const SKINS = [["blueprint","DarkBlue",""],["classic","DarkBlack",""],["minimal","LightOrange",""],["gr","Grey",""],["n01","WhiteBlue",""],["n08","SkyBlue",""],["n12","WhiteDBlue",""],["n16","GreyDarkB",""],["n13","WhiteBGrey",""],["g16","GreyDBlue",""],["n15","SkyDBlue",""],["n18","DarkGrey",""],["n23","NavyLight",""]];
  function setSkin(n){
    document.documentElement.dataset.skin = n;
    const sel = $('skinSel');
    if (sel){
      [].forEach.call(sel.options, o => {
        if (o.value) o.textContent = (o.value === n ? '✓ ' : '') + (o.dataset.l || o.textContent.replace(/^✓ /,''));
      });
      sel.selectedIndex = 0;
    }
    try{ localStorage.setItem('sim-skin', n); }catch(_){}
  }
  (function(){
    const sel = $('skinSel');
    const o0 = document.createElement('option');
    o0.textContent = 'Skins'; o0.value = ''; o0.hidden = true; sel.appendChild(o0);
    SKINS.forEach(k => {
      const o = document.createElement('option');
      o.value = k[0]; o.textContent = k[1]; o.dataset.l = k[1];
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => { if (sel.value) setSkin(sel.value); });
  })();
  let skin0 = 'blueprint';
  try{ skin0 = localStorage.getItem('sim-skin') || 'blueprint'; }catch(_){}
  if (!SKINS.some(k => k[0] === skin0)) skin0 = 'blueprint';
  setSkin(skin0);

  renderTabs();
  renderSubTabs();
  render();
</script>
</body>
</html>
